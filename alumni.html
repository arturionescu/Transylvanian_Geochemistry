<h1>Former members and alumni</h1>


<div class="staff">
  <div class="item">
    <section class="staff">
      <div class="details">

        {% for author in site.previousmemb %}
          <h2 class="name">
            {% if author.photo %}
              <img class="img-rounded"
                   src="{{ author.photo }}"
                   alt="{{ author.display_name | escape }}"
                   width="300"
                   loading="lazy">
            {% endif %}

            <a href="{{ site.baseurl }}{{ author.url }}">
              {{ author.display_name }}
            </a>
          </h2>

          <p class="position">{{ author.position }}</p>
          <p>{{ author.bio }}</p>
        {% endfor %}

      </div>
    </section>
  </div>
</div>
