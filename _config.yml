# Site Settings
name: Transylvanian Geochemistry Research Group
title: Transylvanian Geochem RG
description: "The website of the Transylvanian Geochemistry Research Group, working on the origin and interaction of fluids in different geotectonic settings."

tags:
  - science
  - fluid geochemistry
  - research group
  - Transylvania
  - carbon cycle

show_hero: true

menu:
  - title: Home
    url: /
  - title: Project
    url: /project
  - title: Team
    url: /staff
  - title: Collaborators
    url: /external
  - title: Field Work and Expeditions
    url: /expeditions
  - title: Media
    url: /media
  - title: The Science
    url: /scientists
  - title: Contact
    url: /contact

email: youremail@test.com
disqus_username: disqus_username
formspree_form_id: formspree_form_id

# Social Media
github_username: github_username
facebook_username: facebook_username
twitter_username: twitter_username
instagram_username: instagram_username
linkedin_username: linkedin_username
medium_username: medium_username

# Posts
show_time_bar: true
show_modal_on_exit: false
show_modal_on_finish_post: true
two_columns_layout: true

# Advanced Settings
baseurl: ""
url: "https://www.transylvaniangeochemistry.org"
google_analytics: "G-WLWEDBWSZZ"
language: "en"
categories_folder: category
sent_message_url: "/contact/message-sent/"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

collections:
  authors:
    output: true
  collaborators:
    output: true

# Homepage pagination
paginate: 10
paginate_path: "/page/:num/"

show_get_theme_btn: true
use_logo: false

# SASS
sass:
  style: compressed

# Plugins supported by GitHub Pages
plugins:
  - jekyll-paginate

# Excluded files
exclude:
  - docs/
  - vendor/
  - LICENSE
  - CHANGELOG.md
  - jekflix.gemspec
  - package.json
  - package-lock.json
  - src
  - node_modules
  - initpost.sh
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - README.md

# Theme
version: v1.0
